// ====== UTILITIES ======
function parseHost(name) {
  if (!name) return 'Unknown';
  const cleaned = name.replace(/[^\x00-\x7F]/g,'').replace(/[^a-zA-Z0-9\s:—\-]/g,'').trim();
  const m = cleaned.match(/(?::|[—]|-{1,2})\s*([A-Za-z]{2,})\s*$/i);
  if (m) {
    const h = m[1].toUpperCase();
    if (HOSTS.includes(h)) return h;
  }
  for (const h of HOSTS) {
    if (name.toUpperCase().includes(h)) return h;
  }
  return 'Unknown';
}

function pNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  return parseFloat(String(v).replace(/[^0-9.-]/g,'')) || 0;
}

function fmtRM(n) {
  if (!n || isNaN(n)) return 'RM0';
  if (n >= 1000000) return 'RM' + (n/1000000).toFixed(1) + 'M';
  if (n >= 1000)    return 'RM' + (n/1000).toFixed(1) + 'K';
  return 'RM' + Math.round(n);
}

function fmtN(n) {
  if (!n || isNaN(n)) return '0';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function getMonthKey(ds) {
  if (!ds) return '';
  const d = new Date(ds);
  if (isNaN(d)) return '';
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()] + ' ' + d.getFullYear();
}

function slot2h(h) {
  const s=['12AM-2AM','2AM-4AM','4AM-6AM','6AM-8AM','8AM-10AM','10AM-12PM',
           '12PM-2PM','2PM-4PM','4PM-6PM','6PM-8PM','8PM-10PM','10PM-12AM'];
  return s[Math.floor(h/2)%12];
}
function slot4h(h) {
  const s=['12AM-4AM','4AM-8AM','8AM-12PM','12PM-4PM','4PM-8PM','8PM-12AM'];
  return s[Math.floor(h/4)%6];
}
const SLOTS_2H = ['12AM-2AM','2AM-4AM','4AM-6AM','6AM-8AM','8AM-10AM','10AM-12PM',
                  '12PM-2PM','2PM-4PM','4PM-6PM','6PM-8PM','8PM-10PM','10PM-12AM'];
const SLOTS_4H = ['12AM-4AM','4AM-8AM','8AM-12PM','12PM-4PM','4PM-8PM','8PM-12AM'];

// ====== MOCK DATA GENERATOR ======
function seededRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
}

function generateMockData() {
  const rng = seededRng(42);
  const rows = [];
  const hostBase = {
    YANA:  {gmv:3200, viewers:800,  atc:120, dur:180},
    FILZA: {gmv:4100, viewers:950,  atc:145, dur:150},
    MAS:   {gmv:2800, viewers:650,  atc:100, dur:120},
    QAQA:  {gmv:5200, viewers:1200, atc:180, dur:240},
    LISA:  {gmv:3600, viewers:850,  atc:130, dur:150},
    SITI:  {gmv:2400, viewers:580,  atc:90,  dur:90 },
  };
  function cMult(d) {
    const mo = d.getMonth(), day = d.getDate();
    if (mo===0  && day>=10 && day<=12) return 2.8;
    if (mo===1  && day>=14 && day<=15) return 2.2;
    if (mo===2  && day>=20 && day<=25) return 2.5;
    if (mo===3  && day>=3  && day<=5)  return 3.2;
    if (mo===4  && day>=5  && day<=6)  return 2.8;
    if (day===15 || day===16)          return 1.75;
    return 1.0;
  }
  let id = 1;
  const cur = new Date('2026-01-01');
  const end = new Date('2026-05-31');
  while (cur <= end) {
    const sess = Math.floor(rng()*4)+2;
    for (let i=0;i<sess;i++) {
      const host = HOSTS[Math.floor(rng()*HOSTS.length)];
      const names = STREAM_NAMES[host];
      const nm = names[Math.floor(rng()*names.length)];
      const base = hostBase[host];
      const mult = cMult(cur);
      const noise = 0.7 + rng()*0.6;
      const startHour = Math.floor(rng()*20)+2;
      const startMin  = Math.floor(rng()*4)*15;
      const duration  = Math.floor(base.dur*(0.8+rng()*0.4));
      const viewers   = Math.floor(base.viewers*mult*noise);
      const atc       = Math.floor(base.atc*mult*noise);
      const clicks    = Math.floor(viewers*(0.15+rng()*0.2));
      const orders    = Math.floor(clicks*(0.08+rng()*0.12));
      const gmv       = Math.floor(base.gmv*mult*noise);
      const ds        = cur.toISOString().split('T')[0];
      rows.push({
        id: id++, date: ds, month: getMonthKey(ds),
        streamName: nm, host,
        startHour, startTime: String(startHour).padStart(2,'0')+':'+String(startMin).padStart(2,'0'),
        duration, viewers, atc, uniqueClicks: clicks, orders, gmv,
        ctr:  viewers>0 ? clicks/viewers*100 : 0,
        ctor: clicks>0  ? orders/clicks*100  : 0,
      });
    }
    cur.setDate(cur.getDate()+1);
  }
  return rows;
}
const MOCK_DATA = generateMockData();

// ====== FILE UPLOAD MODAL ======
const FileUpload = ({ onData, onClose }) => {
  const [drag, setDrag] = useState(false);
  const ref = useRef();
  const process = function(f) {
    Papa.parse(f, { header:true, skipEmptyLines:true, complete: function(res) {
      const keys = res.data[0] ? Object.keys(res.data[0]) : [];
      const find = function(aliases) { return keys.find(function(k){ return aliases.some(function(a){ return k.toLowerCase().includes(a); }); }) || null; };
      const dateC  = find(['date','tarikh','period','data']);
      const nameC  = find(['name','title','livestream','stream','nama']);
      const timeC  = find(['start time','start','waktu','jam']);
      const durC   = find(['duration','dur','tempoh','length']);
      const viewC  = find(['viewer','penonton','views','audience']);
      const atcC   = find(['atc','add to cart','cart','tambah']);
      const clickC = find(['unique click','click','klik']);
      const orderC = find(['order','confirmed','pesanan']);
      const gmvC   = find(['gmv','sales','revenue','rm','amount']);
      const rows = res.data.map(function(r) {
        const ds = dateC ? r[dateC] : '';
        const nm = nameC ? r[nameC] : '';
        const ts = timeC ? r[timeC] : '12:00';
        const sh = parseInt((ts||'12').split(':')[0]) || 12;
        const gv = pNum(gmvC   ? r[gmvC]   : 0);
        const vw = pNum(viewC  ? r[viewC]  : 0);
        const at = pNum(atcC   ? r[atcC]   : 0);
        const cl = pNum(clickC ? r[clickC] : 0);
        const or = pNum(orderC ? r[orderC] : 0);
        const du = pNum(durC   ? r[durC]   : 0);
        return {
          date: ds, month: getMonthKey(ds), streamName: nm, host: parseHost(nm),
          startHour: sh, startTime: ts||'12:00', duration: du,
          viewers: vw, atc: at, uniqueClicks: cl, orders: or, gmv: gv,
          ctr:  vw>0 ? cl/vw*100 : 0,
          ctor: cl>0 ? or/cl*100 : 0,
        };
      }).filter(function(r){ return r.gmv > 0 || r.viewers > 0; });
      onData(rows);
    }});
  };
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
      <div className="bg-slate-800 rounded-2xl border border-slate-600 p-8 max-w-lg w-full shadow-2xl">
        <div className="flex justify-between items-center mb-6">
          <h2 className="text-lg font-bold text-white">Upload Shopee Live Data</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none">✕</button>
        </div>
        <div
          onDrop={function(e){e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)process(f);}}
          onDragOver={function(e){e.preventDefault();setDrag(true);}}
          onDragLeave={function(){setDrag(false);}}
          onClick={function(){if(ref.current)ref.current.click();}}
          className={'border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition-all mb-4 ' + (drag ? 'border-indigo-400 bg-indigo-500/10' : 'border-slate-600 hover:border-indigo-500/50 hover:bg-slate-700/30')}>
          <input ref={ref} type="file" accept=".csv" className="hidden" onChange={function(e){if(e.target.files[0])process(e.target.files[0]);}}/>
          <div className="flex justify-center mb-3 text-indigo-400"><IC.Upload/></div>
          <p className="text-slate-300 font-medium">Drag &amp; drop your CSV file here</p>
          <p className="text-slate-500 text-sm mt-1">Supports Shopee Live export format (.csv)</p>
        </div>
        <div className="text-xs text-slate-500 bg-slate-700/50 rounded-lg p-3">
          <p className="font-semibold text-slate-400 mb-1">Expected columns (flexible matching):</p>
          <p>Date · Livestream Name · Start Time · Duration · Viewers · ATC · Unique Clicks · Orders · GMV/Sales</p>
        </div>
      </div>
    </div>
  );
};

const App = function() {
  const [rawData, setRawData]           = useState(MOCK_DATA);
  const [showUpload, setShowUpload]     = useState(false);
  const [selMonth, setSelMonth]         = useState('All');
  const [last30, setLast30]             = useState(false);
  const [hostSel, setHostSel]           = useState([]);
  const [activeTab, setActiveTab]       = useState('overview');
  const [slotGrain, setSlotGrain]       = useState('2h');
  const [deepMetric, setDeepMetric]     = useState('gmv');
  const [insHost, setInsHost]           = useState('QAQA');
  const [insSlot, setInsSlot]           = useState('2h');
  const [bundleSKU, setBundleSKU]       = useState('Lipscreen');
  const [leagueMetric, setLeagueMetric] = useState('gmv');

  const isDemo = rawData === MOCK_DATA;

  const availMonths = useMemo(function() {
    const s = new Set(rawData.map(function(r){return r.month;}).filter(Boolean));
    return ['All'].concat(MONTHS_LIST.filter(function(m){return s.has(m);}));
  }, [rawData]);

  const filtered = useMemo(function() {
    let d = rawData;
    if (last30) {
      const dates = d.map(function(r){return new Date(r.date);}).filter(function(x){return !isNaN(x);});
      if (dates.length) {
        const mx = new Date(Math.max.apply(null, dates.map(function(x){return x.getTime();})));
        const cut = new Date(mx); cut.setDate(cut.getDate()-30);
        d = d.filter(function(r){return new Date(r.date)>=cut;});
      }
    } else if (selMonth !== 'All') {
      d = d.filter(function(r){return r.month===selMonth;});
    }
    if (hostSel.length) d = d.filter(function(r){return hostSel.includes(r.host);});
    return d;
  }, [rawData, selMonth, last30, hostSel]);

  const kpi = useMemo(function() {
    const gmv     = filtered.reduce(function(s,r){return s+r.gmv;}, 0);
    const viewers = filtered.reduce(function(s,r){return s+r.viewers;}, 0);
    const atc     = filtered.reduce(function(s,r){return s+r.atc;}, 0);
    const clicks  = filtered.reduce(function(s,r){return s+r.uniqueClicks;}, 0);
    const orders  = filtered.reduce(function(s,r){return s+r.orders;}, 0);
    const hours   = filtered.reduce(function(s,r){return s+(r.duration||0);}, 0)/60;
    const n       = filtered.length;
    const ctr     = viewers>0 ? clicks/viewers*100 : 0;
    const ctor    = clicks>0  ? orders/clicks*100  : 0;
    const prevM   = (!last30 && selMonth!=='All') ? MONTHS_LIST[MONTHS_LIST.indexOf(selMonth)-1] : null;
    const prevGMV = prevM ? rawData.filter(function(r){return r.month===prevM;}).reduce(function(s,r){return s+r.gmv;},0) : null;
    const mom     = prevGMV ? (gmv-prevGMV)/prevGMV*100 : null;
    return { gmv, viewers, atc, clicks, orders, hours, n, ctr, ctor, mom };
  }, [filtered, selMonth, last30, rawData]);

  const momData = useMemo(function() {
    return MONTHS_LIST.map(function(m) {
      const md = rawData.filter(function(r){return r.month===m;});
      return {
        month: m.replace(' 2026',''),
        gmv:     md.reduce(function(s,r){return s+r.gmv;},0),
        viewers: md.reduce(function(s,r){return s+r.viewers;},0),
        sessions: md.length,
        hours:   md.reduce(function(s,r){return s+(r.duration||0);},0)/60,
      };
    });
  }, [rawData]);

  const hostData = useMemo(function() {
    const mp = {};
    filtered.forEach(function(r) {
      if (!r.host||r.host==='Unknown') return;
      if (!mp[r.host]) mp[r.host]={host:r.host,gmv:0,viewers:0,atc:0,clicks:0,orders:0,sessions:0,duration:0};
      const h = mp[r.host];
      h.gmv+=r.gmv; h.viewers+=r.viewers; h.atc+=r.atc;
      h.clicks+=r.uniqueClicks; h.orders+=r.orders;
      h.sessions+=1; h.duration+=(r.duration||0);
    });
    return HOSTS.map(function(h) {
      const d = mp[h]||{host:h,gmv:0,viewers:0,atc:0,clicks:0,orders:0,sessions:0,duration:0};
      return Object.assign({}, d, {
        ctr:    d.viewers>0 ? d.clicks/d.viewers*100 : 0,
        ctor:   d.clicks>0  ? d.orders/d.clicks*100  : 0,
        avgGMV: d.sessions>0 ? d.gmv/d.sessions : 0,
        hours:  d.duration/60,
      });
    });
  }, [filtered]);

  const slotData = useMemo(function() {
    const fn    = slotGrain==='2h' ? slot2h : slot4h;
    const order = slotGrain==='2h' ? SLOTS_2H : SLOTS_4H;
    const mp = {};
    order.forEach(function(sl) {
      const obj = {slot:sl, gmv:0, viewers:0, sessions:0};
      HOSTS.forEach(function(h){obj[h]=0;});
      mp[sl] = obj;
    });
    filtered.forEach(function(r) {

          </div>
        )}

        {/* ── LEAGUE TABLE ── */}
        {activeTab==='league' && (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs text-slate-500">Rank by:</span>
              {[['gmv','GMV'],['ctor','CTOR %'],['ctr','CTR %'],['hours','Live Hours'],['sessions','Sessions']].map(function(pair) {
                return <Btn key={pair[0]} active={leagueMetric===pair[0]} onClick={function(){setLeagueMetric(pair[0]);}}>{pair[1]}</Btn>;
              })}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <Card title="🏆 Top Performers" icon={<IC.Trophy/>}>
                <div className="space-y-2">
                  {leagueData.slice(0,3).map(function(h,i) {
                    const medals=['🥇','🥈','🥉'];
                    const val = h[leagueMetric]||0;
                    const disp = leagueMetric==='gmv' ? fmtRM(val) : (leagueMetric==='sessions'||leagueMetric==='hours') ? Math.round(val).toString() : val.toFixed(1)+'%';
                    return (
                      <div key={h.host} className="flex items-center gap-3 p-3 bg-slate-700/40 rounded-xl border border-slate-600/40">
                        <span className="text-xl w-7 text-center">{medals[i]}</span>
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-sm" style={{color:HOST_COLORS[h.host]}}>{h.host}</p>
                          <p className="text-xs text-slate-400">{h.sessions} sessions · {h.hours.toFixed(0)}h live</p>
                        </div>
                        <div className="text-right">
                          <p className="text-sm font-bold text-white">{disp}</p>
                          <p className="text-xs text-slate-500">{leagueMetric.toUpperCase()}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
              <Card title="📉 Needs Improvement" icon={<IC.TrendDown/>}>
                <div className="space-y-2">
                  {leagueData.slice(-3).reverse().map(function(h,i) {
                    const val = h[leagueMetric]||0;
                    const disp = leagueMetric==='gmv' ? fmtRM(val) : (leagueMetric==='sessions'||leagueMetric==='hours') ? Math.round(val).toString() : val.toFixed(1)+'%';
                    return (
                      <div key={h.host} className="flex items-center gap-3 p-3 bg-slate-700/40 rounded-xl border border-slate-600/40">
                        <div className="w-7 h-7 rounded-full bg-red-500/20 flex items-center justify-center text-xs text-red-400 font-bold flex-shrink-0">
                          {'#'+(leagueData.length-i)}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-sm" style={{color:HOST_COLORS[h.host]}}>{h.host}</p>
                          <p className="text-xs text-slate-400">{h.sessions} sessions · {h.hours.toFixed(0)}h live</p>
                        </div>
                        <div className="text-right">
                          <p className="text-sm font-bold text-white">{disp}</p>
                          <p className="text-xs text-slate-500">{leagueMetric.toUpperCase()}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>
            <Card title="Full League Standings" icon={<IC.BarChart/>}>
              <div className="space-y-3">
                {leagueData.map(function(h,i) {
                  const maxV = (leagueData[0]&&leagueData[0][leagueMetric])||1;
                  const val  = h[leagueMetric]||0;
                  const pct  = maxV>0 ? Math.round(val/maxV*100) : 0;
                  const disp = leagueMetric==='gmv' ? fmtRM(val) : (leagueMetric==='sessions'||leagueMetric==='hours') ? Math.round(val).toString() : val.toFixed(1)+'%';
                  return (
                    <div key={h.host} className="flex items-center gap-3">
                      <span className="text-xs text-slate-500 w-4 text-right">{i+1}</span>
                      <span className="text-sm font-bold w-14" style={{color:HOST_COLORS[h.host]}}>{h.host}</span>
                      <div className="flex-1 bg-slate-700 rounded-full h-3">
                        <div className="h-3 rounded-full transition-all duration-500"
                          style={{width:pct+'%', backgroundColor:HOST_COLORS[h.host]}}></div>
                      </div>
                      <span className="text-xs text-slate-200 w-20 text-right font-medium">{disp}</span>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}

        {/* ── HOTSPOT MATRIX ── */}
        {activeTab==='hotspot' && (
          <Card title="Monthly Sales Hotspot Matrix — 4-Hour Slots × Month" icon={<IC.Fire/>}>
            <p className="text-xs text-slate-500 mb-5">GMV aggregated by month and 4-hour time slot · Green ring = peak · Red ring = lowest non-zero slot</p>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className="text-slate-500 border-b border-slate-700">
                    <th className="text-left py-2 pr-4 w-16">Month</th>
                    {SLOTS_4H.map(function(s) {
                      return <th key={s} className="text-center py-2 px-1 font-normal text-slate-400">{s}</th>;
                    })}
                  </tr>
                </thead>
                <tbody>
                  {MONTHS_LIST.map(function(m) {
                    return (
                      <tr key={m} className="border-b border-slate-700/40">
                        <td className="py-3 pr-4 text-slate-300 font-semibold text-xs">{m.replace(' 2026','')}</td>
                        {SLOTS_4H.map(function(sl) {
                          const v = (hotspot.mx[m]&&hotspot.mx[m][sl])||0;
                          const intensity = hotspot.maxV>0 ? v/hotspot.maxV : 0;
                          const isPeak = v>0 && v===hotspot.maxV;
                          const isLow  = v>0 && hotspot.minV>0 && v===hotspot.minV;
                          const bg = v>0
                            ? 'rgba(99,102,241,' + (intensity*0.75+0.1).toFixed(2) + ')'
                            : 'rgba(30,41,59,0.4)';
                          return (
                            <td key={sl} className="text-center py-2 px-1">
                              <div className={'rounded-lg py-2 px-1 mx-auto ' + (isPeak?'ring-2 ring-green-400':isLow?'ring-2 ring-red-400':'')}
                                style={{backgroundColor:bg, minWidth:'66px'}}>
                                <p className="font-bold text-white leading-none">{v>0 ? fmtRM(v) : '—'}</p>
                                {isPeak && <p className="text-green-400 text-[9px] mt-0.5">▲ PEAK</p>}
                                {isLow  && <p className="text-red-400   text-[9px] mt-0.5">▼ LOW</p>}
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="flex flex-wrap items-center gap-4 mt-5 text-xs text-slate-500">
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{backgroundColor:'rgba(99,102,241,0.15)'}}></div>Low volume</div>
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{backgroundColor:'rgba(99,102,241,0.5)'}}></div>Medium</div>
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{backgroundColor:'rgba(99,102,241,0.85)'}}></div>High</div>
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded ring-2 ring-green-400"></div>Peak slot</div>
              <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded ring-2 ring-red-400"></div>Lowest slot</div>
            </div>
          </Card>
        )}

      </div>

      {/* FOOTER */}
      <div className="border-t border-slate-700/50 mt-8 py-4 text-center text-xs text-slate-600">
        Shopee Live Analytics Dashboard · {isDemo ? 'Demo data — upload your CSV to see real metrics' : rawData.length + ' sessions loaded'}
      </div>

    </div>
  );
};

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
