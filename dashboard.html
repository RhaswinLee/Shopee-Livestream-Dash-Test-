<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shopee Live Dashboard 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<style>
  body { margin:0; background:#030712; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:#111827; }
  ::-webkit-scrollbar-thumb { background:#374151; border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
  ResponsiveContainer, ComposedChart, Area, Line, Cell
} = Recharts;

// ── ICONS ────────────────────────────────────────────────────────────────────
const IC = {
  Clock: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  TrendUp: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{width:14,height:14}}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
  TrendDown: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{width:14,height:14}}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>,
  Crown: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/></svg>,
  Dollar: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
  Eye: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  Cart: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>,
  Target: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
  Zap: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  Bulb: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>,
  Package: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
  Bar2: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:18,height:18}}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
  Cal: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:16,height:16}}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  Star: () => <svg viewBox="0 0 24 24" fill="currentColor" style={{width:14,height:14}}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
};

// ── SEEDED RANDOM ─────────────────────────────────────────────────────────────
let _s = 12345;
const sr = () => { _s = (_s * 1664525 + 1013904223) & 0xffffffff; return ((_s >>> 0) / 0xffffffff); };
const ri = (a,b) => Math.floor(sr()*(b-a+1))+a;
const rf = (a,b) => sr()*(b-a)+a;

// ── MOCK DATA ─────────────────────────────────────────────────────────────────
const HOSTS = ['Yana','Filza','Mas','Qaqa','Lisa','Siti'];
const HOST_CLR = { Yana:'#f97316', Filza:'#8b5cf6', Mas:'#10b981', Qaqa:'#ec4899', Lisa:'#3b82f6', Siti:'#f59e0b' };
const HOST_MULT = { Yana:1.35, Filza:1.15, Mas:0.92, Qaqa:1.05, Lisa:0.82, Siti:1.22 };

const slotOf2h = h => {
  if (h<2) return '12AM–2AM';
  if (h<4) return '2AM–4AM';
  if (h<6) return '4AM–6AM';
  if (h<8) return '6AM–8AM';
  if (h<10) return '8AM–10AM';
  if (h<12) return '10AM–12PM';
  if (h<14) return '12PM–2PM';
  if (h<16) return '2PM–4PM';
  if (h<18) return '4PM–6PM';
  if (h<20) return '6PM–8PM';
  if (h<22) return '8PM–10PM';
  return '10PM–12AM';
};
const slotOf4h = h => {
  if (h<4) return '12AM–4AM';
  if (h<8) return '4AM–8AM';
  if (h<12) return '8AM–12PM';
  if (h<16) return '12PM–4PM';
  if (h<20) return '4PM–8PM';
  return '8PM–12AM';
};

const MONTH_CFG = [
  { m:0, lbl:'Jan', name:'January',  nSess:22, bViewer:1100, bGMV:140, mult:1.0,
    camps:[{d:1,n:'New Year',x:1.5},{d:25,n:'Payday',x:1.6}] },
  { m:1, lbl:'Feb', name:'February', nSess:16, bViewer:850,  bGMV:110, mult:0.72,
    camps:[{d:14,n:"Valentine's",x:1.45},{d:25,n:'Payday',x:1.5},{d:28,n:'Pre-Ramadan',x:1.35}] },
  { m:2, lbl:'Mar', name:'March',    nSess:32, bViewer:1500, bGMV:170, mult:1.35,
    camps:[{d:7,n:'Ramadan W1',x:1.6},{d:14,n:'Ramadan W2',x:1.75},{d:21,n:'Ramadan W3',x:1.9},{d:25,n:'Ramadan Payday',x:2.2}] },
  { m:3, lbl:'Apr', name:'April',    nSess:29, bViewer:1750, bGMV:195, mult:1.55,
    camps:[{d:4,n:'4.4 Sale',x:3.5},{d:5,n:'Post 4.4',x:2.1},{d:10,n:'Eid Prep',x:1.95},{d:25,n:'Payday',x:1.65}] },
  { m:4, lbl:'May', name:'May',      nSess:25, bViewer:1350, bGMV:155, mult:1.18,
    camps:[{d:5,n:'5.5 Sale',x:2.2},{d:15,n:'Mid-Month',x:1.3},{d:25,n:'Payday 5.25',x:1.75}] },
];

const TIME_SLOTS = [
  {h:0,dur:[2,3]},{h:2,dur:[1,2]},{h:8,dur:[2,4]},{h:10,dur:[2,4]},
  {h:12,dur:[2,4]},{h:14,dur:[2,3]},{h:16,dur:[2,4]},{h:18,dur:[2,3]},
  {h:20,dur:[2,4]},{h:22,dur:[2,3]},
];

const SESSIONS = [];
let sid = 1;
MONTH_CFG.forEach(cfg => {
  const maxDay = cfg.m===1?28:cfg.m===3?30:31;
  for (let s=0; s<cfg.nSess; s++) {
    const day = ri(1, maxDay);
    const dateStr = `2026-${String(cfg.m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    let campMult=1, campName='';
    for (const c of cfg.camps) {
      if (Math.abs(day-c.d)<=1){ campMult=c.x; campName=c.n; break; }
    }
    const ts = TIME_SLOTS[ri(0,TIME_SLOTS.length-1)];
    const startH = (ts.h + ri(0,1)) % 24;
    const dur = ts.dur[0] + ri(0, ts.dur[1]-ts.dur[0]);
    const startMin = ri(0,3)*15;
    const host = HOSTS[ri(0,HOSTS.length-1)];
    const hm = HOST_MULT[host]||1;
    const nightBonus = (startH>=20||startH<2)?1.3:1;
    const viewers = Math.floor(cfg.bViewer*cfg.mult*campMult*hm*nightBonus*rf(0.65,1.35));
    const impressions = Math.floor(viewers*rf(2.2,4.5));
    const uniqueClicks = Math.floor(viewers*rf(0.12,0.35));
    const atc = Math.floor(uniqueClicks*rf(0.28,0.55));
    const placed = Math.floor(atc*rf(0.25,0.55));
    const confirmed = Math.floor(placed*rf(0.55,0.92));
    const aov = rf(38,130)*campMult;
    const gmv = Math.floor(confirmed*aov);
    const ctr = viewers>0?(uniqueClicks/viewers*100):0;
    const ctor = uniqueClicks>0?(confirmed/uniqueClicks*100):0;
    SESSIONS.push({
      id:sid++, date:dateStr, month:cfg.m, monthLbl:cfg.lbl, monthName:cfg.name,
      host, streamName:`${host} Live${campName?' ['+campName+']':''}`,
      startHour:startH, startTime:`${String(startH).padStart(2,'0')}:${String(startMin).padStart(2,'0')}`,
      duration:dur, slot2h:slotOf2h(startH), slot4h:slotOf4h(startH),
      viewers, impressions, uniqueClicks, atc, placed, confirmed, gmv,
      isCampaign:!!campName, campaignName:campName, ctr, ctor,
    });
  }
});
SESSIONS.sort((a,b)=>a.date.localeCompare(b.date));

// ── FORMATTERS ────────────────────────────────────────────────────────────────
const fmt = n => n>=1000000?`RM ${(n/1e6).toFixed(2)}M`:n>=1000?`RM ${(n/1000).toFixed(1)}K`:`RM ${Math.floor(n)}`;
const fmtN = n => n>=1000000?`${(n/1e6).toFixed(1)}M`:n>=1000?`${(n/1000).toFixed(1)}K`:String(Math.floor(n));
const pct = n => `${n.toFixed(1)}%`;

// ── SUB-COMPONENTS ────────────────────────────────────────────────────────────
const Card = ({children, className=''}) => (
  <div className={`bg-gray-900 border border-gray-800 rounded-2xl p-5 ${className}`}>{children}</div>
);

const SecHead = ({icon:I, title, sub}) => (
  <div className="flex items-center gap-3 mb-4">
    <div className="p-2 rounded-xl bg-orange-500/10 text-orange-400"><I/></div>
    <div><p className="font-semibold text-white text-base">{title}</p>{sub&&<p className="text-gray-500 text-xs mt-0.5">{sub}</p>}</div>
  </div>
);

const KPICard = ({title, val, sub, icon:I, accent, trend}) => (
  <Card>
    <div className="flex justify-between items-start">
      <div>
        <p className="text-gray-500 text-xs uppercase tracking-wider mb-1">{title}</p>
        <p className="text-2xl font-bold text-white">{val}</p>
        {sub && <p className="text-gray-600 text-xs mt-0.5">{sub}</p>}
      </div>
      <div className="p-2.5 rounded-xl" style={{background:accent+'22',color:accent}}><I/></div>
    </div>
    {trend!=null && (
      <div className={`flex items-center gap-1 mt-3 text-xs font-semibold ${trend>=0?'text-emerald-400':'text-rose-400'}`}>
        {trend>=0?<IC.TrendUp/>:<IC.TrendDown/>}
        <span>{Math.abs(trend).toFixed(1)}% MoM</span>
        <span className="text-gray-600 font-normal ml-1">vs prev month</span>
      </div>
    )}
  </Card>
);

const TT = ({contentStyle={background:'#111827',border:'1px solid #374151',borderRadius:8}, ...p}) => (
  <Tooltip contentStyle={contentStyle} labelStyle={{color:'#f9fafb',fontWeight:600}} {...p}/>
);

// ── MAIN DASHBOARD ────────────────────────────────────────────────────────────
const App = () => {
  const [selMonth, setSelMonth] = useState('all');
  const [sortMode, setSortMode] = useState('gmv');
  const [slotTab, setSlotTab] = useState('2h');

  const MONTHS = [
    {k:'all',l:'All Months'},{k:'0',l:'Jan 2026'},{k:'1',l:'Feb 2026'},
    {k:'2',l:'Mar 2026'},{k:'3',l:'Apr 2026'},{k:'4',l:'May 2026'},
  ];

  const filtered = useMemo(()=>
    selMonth==='all'?SESSIONS:SESSIONS.filter(s=>s.month===parseInt(selMonth))
  ,[selMonth]);

  const kpi = useMemo(()=>{
    const gmv=filtered.reduce((a,s)=>a+s.gmv,0);
    const hours=filtered.reduce((a,s)=>a+s.duration,0);
    const viewers=filtered.reduce((a,s)=>a+s.viewers,0);
    const impressions=filtered.reduce((a,s)=>a+s.impressions,0);
    const atc=filtered.reduce((a,s)=>a+s.atc,0);
    const confirmed=filtered.reduce((a,s)=>a+s.confirmed,0);
    const clicks=filtered.reduce((a,s)=>a+s.uniqueClicks,0);
    const avgV=filtered.length?Math.floor(viewers/filtered.length):0;
    const avgCTR=filtered.length?(filtered.reduce((a,s)=>a+s.ctr,0)/filtered.length):0;
    const avgCTOR=filtered.length?(filtered.reduce((a,s)=>a+s.ctor,0)/filtered.length):0;
    return {gmv,hours,sessions:filtered.length,viewers,impressions,atc,confirmed,clicks,avgV,avgCTR,avgCTOR};
  },[filtered]);

  const mom = useMemo(()=>{
    if(selMonth==='all'||selMonth==='0') return null;
    const cur=parseInt(selMonth), prev=cur-1;
    const cd=SESSIONS.filter(s=>s.month===cur), pd=SESSIONS.filter(s=>s.month===prev);
    const ch=cd.reduce((a,s)=>a+s.duration,0), ph=pd.reduce((a,s)=>a+s.duration,0);
    const cg=cd.reduce((a,s)=>a+s.gmv,0), pg=pd.reduce((a,s)=>a+s.gmv,0);
    return { hMoM:ph?((ch-ph)/ph*100):0, gMoM:pg?((cg-pg)/pg*100):0 };
  },[selMonth]);

  const monthTrend = useMemo(()=>[0,1,2,3,4].map(m=>{
    const d=SESSIONS.filter(s=>s.month===m);
    return {
      month:['Jan','Feb','Mar','Apr','May'][m],
      gmv:d.reduce((a,s)=>a+s.gmv,0),
      hours:d.reduce((a,s)=>a+s.duration,0),
      sessions:d.length,
    };
  }),[]);

  const hostPerf = useMemo(()=>{
    const map={};
    filtered.forEach(s=>{
      if(!map[s.host]) map[s.host]={host:s.host,sessions:0,viewers:0,clicks:0,atc:0,confirmed:0,gmv:0,hours:0};
      const h=map[s.host];
      h.sessions++; h.viewers+=s.viewers; h.clicks+=s.uniqueClicks;
      h.atc+=s.atc; h.confirmed+=s.confirmed; h.gmv+=s.gmv; h.hours+=s.duration;
    });
    return Object.values(map).map(h=>({
      ...h,
      ctr:h.viewers?h.clicks/h.viewers*100:0,
      ctor:h.clicks?h.confirmed/h.clicks*100:0,
      gmvPH:h.hours?h.gmv/h.hours:0,
    }));
  },[filtered]);

  const sortedHosts = useMemo(()=>{
    const d=[...hostPerf];
    if(sortMode==='gmv') return d.sort((a,b)=>b.gmv-a.gmv);
    if(sortMode==='ctr') return d.sort((a,b)=>b.ctr-a.ctr);
    if(sortMode==='under') return d.sort((a,b)=>(b.atc/(b.ctor+0.1))-(a.atc/(a.ctor+0.1)));
    return d;
  },[hostPerf,sortMode]);

  const SLOT2H_ORDER=['12AM–2AM','2AM–4AM','4AM–6AM','6AM–8AM','8AM–10AM','10AM–12PM','12PM–2PM','2PM–4PM','4PM–6PM','6PM–8PM','8PM–10PM','10PM–12AM'];
  const SLOT4H_ORDER=['12AM–4AM','4AM–8AM','8AM–12PM','12PM–4PM','4PM–8PM','8PM–12AM'];

  const slotData2h = useMemo(()=>{
    const m={};
    filtered.forEach(s=>{
      if(!m[s.slot2h]) m[s.slot2h]={slot:s.slot2h,sessions:0,hours:0,gmv:0};
      m[s.slot2h].sessions++; m[s.slot2h].hours+=s.duration; m[s.slot2h].gmv+=s.gmv;
    });
    return SLOT2H_ORDER.filter(o=>m[o]).map(o=>({...m[o],gmvPH:m[o].hours?Math.floor(m[o].gmv/m[o].hours):0}));
  },[filtered]);

  const slotData4h = useMemo(()=>{
    const m={};
    filtered.forEach(s=>{
      if(!m[s.slot4h]) m[s.slot4h]={slot:s.slot4h,sessions:0,hours:0,gmv:0};
      m[s.slot4h].sessions++; m[s.slot4h].hours+=s.duration; m[s.slot4h].gmv+=s.gmv;
    });
    return SLOT4H_ORDER.filter(o=>m[o]).map(o=>({...m[o],gmvPH:m[o].hours?Math.floor(m[o].gmv/m[o].hours):0}));
  },[filtered]);

  const peakSession = useMemo(()=>
    filtered.reduce((b,s)=>(!b||s.gmv>b.gmv)?s:b,null)
  ,[filtered]);

  const insights = useMemo(()=>{
    const b2=slotData2h.reduce((a,b)=>a.gmvPH>b.gmvPH?a:b,{slot:'-',gmvPH:0,sessions:0});
    const b4=slotData4h.reduce((a,b)=>a.gmvPH>b.gmvPH?a:b,{slot:'-',gmvPH:0,sessions:0});
    const hostSlotMap={};
    filtered.forEach(s=>{
      const k=`${s.host}||${s.slot2h}`;
      if(!hostSlotMap[k]) hostSlotMap[k]={host:s.host,slot:s.slot2h,gmv:0,sessions:0};
      hostSlotMap[k].gmv+=s.gmv; hostSlotMap[k].sessions++;
    });
    const topPairs=Object.values(hostSlotMap).sort((a,b)=>b.gmv-a.gmv).slice(0,4);
    const underHosts=[...hostPerf].filter(h=>h.ctor<8&&h.atc>30).sort((a,b)=>(b.atc/(b.ctor+.1))-(a.atc/(a.ctor+.1))).slice(0,3);
    return {b2,b4,topPairs,underHosts};
  },[slotData2h,slotData4h,filtered,hostPerf]);

  const periodLbl = selMonth==='all'?'Jan – May 2026':MONTHS.find(m=>m.k===selMonth)?.l;
  const activeSlotData = slotTab==='2h'?slotData2h:slotData4h;

  return (
    <div className="min-h-screen bg-gray-950 text-gray-100" style={{padding:'20px 24px'}}>

      {/* ── HEADER ── */}
      <div className="flex flex-wrap items-start justify-between gap-4 mb-6">
        <div>
          <div className="flex items-center gap-2.5 mb-1.5">
            <div style={{width:32,height:32,background:'linear-gradient(135deg,#f97316,#ec4899)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14,color:'#fff'}}>S</div>
            <span className="text-gray-500 text-sm">Shopee Live · Analytics Hub</span>
          </div>
          <h1 className="text-2xl font-bold text-white">Live Stream Marketing Dashboard</h1>
          <p className="text-gray-500 text-sm mt-0.5">Performance Intelligence · January – May 2026</p>
        </div>
        <div className="flex items-center gap-2 text-emerald-400 text-xs bg-emerald-400/10 px-3 py-1.5 rounded-full border border-emerald-400/20">
          <span style={{width:7,height:7,borderRadius:'50%',background:'#34d399',display:'inline-block'}}/>
          {SESSIONS.length} sessions indexed
        </div>
      </div>

      {/* ── PERIOD FILTER ── */}
      <Card className="mb-6">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-2 text-gray-400 text-sm mr-1">
            <IC.Cal/><span className="font-medium">Period</span>
          </div>
          {MONTHS.map(m=>(
            <button key={m.k} onClick={()=>setSelMonth(m.k)}
              style={selMonth===m.k?{background:'linear-gradient(135deg,#f97316,#ea580c)',color:'#fff',boxShadow:'0 4px 14px rgba(249,115,22,0.3)'}:{}}
              className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${selMonth===m.k?'':'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white'}`}>
              {m.l}
            </button>
          ))}
          <div className="ml-auto flex flex-wrap gap-6">
            {[
              {lbl:'Period',val:periodLbl,cl:'text-white'},
              {lbl:'Sessions',val:kpi.sessions,cl:'text-orange-400'},
              {lbl:'Total GMV',val:fmt(kpi.gmv),cl:'text-emerald-400'},
              {lbl:'Total Hours',val:`${kpi.hours}h`,cl:'text-purple-400'},
            ].map(x=>(
              <div key={x.lbl} className="text-center">
                <div className="text-gray-600 text-xs uppercase tracking-wide">{x.lbl}</div>
                <div className={`font-bold text-sm mt-0.5 ${x.cl}`}>{x.val}</div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      {/* ── KPI ROW ── */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <KPICard title="Total Live Hours" val={`${kpi.hours}h`} sub={`${kpi.sessions} sessions`} icon={IC.Clock} accent="#f97316" trend={mom?.hMoM}/>
        <KPICard title="Total GMV" val={fmt(kpi.gmv)} sub="Confirmed orders value" icon={IC.Dollar} accent="#10b981" trend={mom?.gMoM}/>
        <KPICard title="Avg. Live Viewers" val={fmtN(kpi.avgV)} sub="per session" icon={IC.Eye} accent="#8b5cf6"/>
        <KPICard title="Add-To-Cart" val={fmtN(kpi.atc)} sub={`${fmtN(kpi.confirmed)} confirmed`} icon={IC.Cart} accent="#ec4899"/>
      </div>

      {/* ── TREND + HALL OF FAME ── */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

        {/* GMV Trend */}
        <Card className="lg:col-span-2">
          <SecHead icon={IC.Bar2} title="Monthly GMV & Activity Trend" sub="Revenue, hours, and session volume Jan–May 2026"/>
          <ResponsiveContainer width="100%" height={210}>
            <ComposedChart data={monthTrend} margin={{top:4,right:16,bottom:0,left:0}}>
              <defs>
                <linearGradient id="gG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor="#f97316" stopOpacity={0.35}/>
                  <stop offset="95%" stopColor="#f97316" stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke="#1f2937"/>
              <XAxis dataKey="month" stroke="#374151" tick={{fill:'#9ca3af',fontSize:12}}/>
              <YAxis yAxisId="l" stroke="#374151" tick={{fill:'#6b7280',fontSize:10}} tickFormatter={v=>`RM${(v/1000).toFixed(0)}K`}/>
              <YAxis yAxisId="r" orientation="right" stroke="#374151" tick={{fill:'#6b7280',fontSize:10}}/>
              <TT formatter={(v,n)=>n==='GMV'?[fmt(v),'GMV']:n==='Sessions'?[v,'Sessions']:[`${v}h`,'Hours']}/>
              <Legend wrapperStyle={{color:'#9ca3af',fontSize:12,paddingTop:6}}/>
              <Area yAxisId="l" type="monotone" dataKey="gmv" name="GMV" stroke="#f97316" fill="url(#gG)" strokeWidth={2.5} dot={{r:4,fill:'#f97316'}}/>
              <Bar yAxisId="r" dataKey="sessions" name="Sessions" fill="#8b5cf6" opacity={0.7} radius={[4,4,0,0]}/>
              <Line yAxisId="r" type="monotone" dataKey="hours" name="Hours" stroke="#10b981" strokeWidth={2} dot={{r:3,fill:'#10b981'}} strokeDasharray="5 3"/>
            </ComposedChart>
          </ResponsiveContainer>
        </Card>

        {/* Hall of Fame */}
        {peakSession && (
          <div className="rounded-2xl p-5 border border-amber-700/40" style={{background:'linear-gradient(145deg,#1c1400,#111827)'}}>
            <div className="flex items-center gap-2 mb-4">
              <div className="text-amber-400"><IC.Crown/></div>
              <div>
                <p className="font-bold text-white">Hall of Fame</p>
                <p className="text-amber-700 text-xs">Peak Session · {periodLbl}</p>
              </div>
            </div>
            <div className="rounded-xl p-3 mb-3 border border-amber-600/20" style={{background:'rgba(245,158,11,0.08)'}}>
              <p className="text-amber-300 font-bold text-sm leading-tight">{peakSession.streamName}</p>
              <p className="text-gray-500 text-xs mt-1">{peakSession.date} · {peakSession.startTime} · {peakSession.duration}h stream</p>
            </div>
            <div className="space-y-2">
              {[
                {lbl:'🏆 GMV',val:fmt(peakSession.gmv),cl:'text-emerald-400 font-bold'},
                {lbl:'👁️ Peak Viewers',val:fmtN(peakSession.viewers),cl:'text-white font-semibold'},
                {lbl:'🛒 Add-To-Cart',val:fmtN(peakSession.atc),cl:'text-white font-semibold'},
                {lbl:'✅ Confirmed Orders',val:peakSession.confirmed,cl:'text-white font-semibold'},
                {lbl:'📊 CTR',val:pct(peakSession.ctr),cl:'text-orange-400 font-semibold'},
                {lbl:'🎯 CTOR',val:pct(peakSession.ctor),cl:'text-purple-400 font-semibold'},
              ].map(x=>(
                <div key={x.lbl} className="flex justify-between items-center text-sm">
                  <span className="text-gray-500">{x.lbl}</span>
                  <span className={x.cl}>{x.val}</span>
                </div>
              ))}
            </div>
            {peakSession.isCampaign && (
              <div className="mt-3 text-center py-1.5 rounded-lg border border-orange-500/30 text-orange-300 text-xs font-medium" style={{background:'rgba(249,115,22,0.1)'}}>
                ⚡ {peakSession.campaignName}
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── HOST PERFORMANCE MATRIX ── */}
      <Card className="mb-6">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <SecHead icon={IC.Target} title="Host / Stream Performance Matrix" sub="CTR · CTOR · ATC · GMV analytics"/>
          <div className="flex gap-2 flex-wrap">
            {[
              {k:'gmv',l:'🏆 Top GMV'},
              {k:'ctr',l:'🎯 Top CTR'},
              {k:'under',l:'⚠️ High ATC / Low CTOR'},
            ].map(s=>(
              <button key={s.k} onClick={()=>setSortMode(s.k)}
                style={sortMode===s.k?{background:'linear-gradient(135deg,#f97316,#ea580c)',color:'#fff'}:{}}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${sortMode===s.k?'':'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white'}`}>
                {s.l}
              </button>
            ))}
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[640px]">
            <thead>
              <tr className="border-b border-gray-800">
                {['Host','Sessions','Unique Clicks','ATC','CTR','CTOR','Confirmed','GMV','GMV/hr'].map(h=>(
                  <th key={h} className="text-left text-gray-600 text-xs uppercase tracking-wide pb-2.5 px-2 first:pl-0">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sortedHosts.map((h,i)=>{
                const isUnder=sortMode==='under'&&h.ctor<8&&h.atc>30;
                return (
                  <tr key={h.host} className={`border-b border-gray-800/40 transition-colors hover:bg-gray-800/20 ${isUnder?'bg-amber-950/20':''}`}>
                    <td className="py-3 pl-0 pr-2">
                      <div className="flex items-center gap-2">
                        <div style={{width:28,height:28,borderRadius:'50%',background:HOST_CLR[h.host]+'25',color:HOST_CLR[h.host],display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:12}}>
                          {h.host[0]}
                        </div>
                        <span className="text-white font-medium">{h.host}</span>
                        {isUnder&&<span className="text-amber-400 text-xs bg-amber-400/10 px-1.5 py-0.5 rounded-md">Bundle ⚠️</span>}
                      </div>
                    </td>
                    <td className="py-3 px-2 text-gray-400">{h.sessions}</td>
                    <td className="py-3 px-2 text-gray-300">{fmtN(h.clicks)}</td>
                    <td className="py-3 px-2 text-gray-300">{fmtN(h.atc)}</td>
                    <td className="py-3 px-2">
                      <span style={{color:h.ctr>=20?'#34d399':h.ctr>=12?'#f97316':'#9ca3af'}} className="font-medium">{pct(h.ctr)}</span>
                    </td>
                    <td className="py-3 px-2">
                      <span style={{color:h.ctor>=10?'#34d399':h.ctor>=5?'#f97316':'#f87171'}} className="font-medium">{pct(h.ctor)}</span>
                    </td>
                    <td className="py-3 px-2 text-gray-300">{fmtN(h.confirmed)}</td>
                    <td className="py-3 px-2 text-emerald-400 font-semibold">{fmt(h.gmv)}</td>
                    <td className="py-3 px-2 text-purple-400 font-medium">{fmt(h.gmvPH)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* ── TIME-SLOT ANALYSIS ── */}
      <Card className="mb-6">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <SecHead icon={IC.Clock} title="Time-Slot Split Analysis" sub="Sessions and accumulated hours per broadcast window"/>
          <div className="flex gap-2">
            {[{k:'2h',l:'2-Hour Blocks'},{k:'4h',l:'4-Hour Blocks'}].map(t=>(
              <button key={t.k} onClick={()=>setSlotTab(t.k)}
                style={slotTab===t.k?{background:'#7c3aed',color:'#fff'}:{}}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all ${slotTab===t.k?'':'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white'}`}>
                {t.l}
              </button>
            ))}
          </div>
        </div>
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={activeSlotData} margin={{top:4,right:16,bottom:40,left:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1f2937"/>
            <XAxis dataKey="slot" stroke="#374151" tick={{fill:'#9ca3af',fontSize:10}} angle={-35} textAnchor="end" interval={0}/>
            <YAxis yAxisId="s" stroke="#374151" tick={{fill:'#6b7280',fontSize:10}} label={{value:'Sessions',angle:-90,position:'insideLeft',fill:'#6b7280',fontSize:10}}/>
            <YAxis yAxisId="h" orientation="right" stroke="#374151" tick={{fill:'#6b7280',fontSize:10}} unit="h"/>
            <TT formatter={(v,n)=>[n==='Total Hours'?`${v}h`:v,n]}/>
            <Legend wrapperStyle={{color:'#9ca3af',fontSize:12,paddingTop:4}}/>
            <Bar yAxisId="s" dataKey="sessions" name="Sessions" fill="#8b5cf6" radius={[4,4,0,0]}>
              {activeSlotData.map((e,i)=><Cell key={i} fill={`hsl(${255+i*8},70%,${55+i*2}%)`}/>)}
            </Bar>
            <Bar yAxisId="h" dataKey="hours" name="Total Hours" fill="#f97316" radius={[4,4,0,0]} opacity={0.85}/>
          </BarChart>
        </ResponsiveContainer>
        {/* GMV/hr mini stats */}
        <div className="mt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
          {activeSlotData.slice(0,6).map(s=>(
            <div key={s.slot} className="bg-gray-800/60 rounded-xl p-2.5 text-center border border-gray-700/40">
              <p className="text-gray-500 text-xs truncate">{s.slot}</p>
              <p className="text-orange-400 font-bold text-sm">{fmt(s.gmvPH)}<span className="text-gray-600 text-xs">/hr</span></p>
              <p className="text-gray-600 text-xs">{s.sessions} sess · {s.hours}h</p>
            </div>
          ))}
        </div>
      </Card>

      {/* ── VIEWERSHIP STATS ── */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {[
          {lbl:'Live Impressions',val:fmtN(kpi.impressions),sub:'total reach',cl:'#f97316'},
          {lbl:'Unique Clicks',val:fmtN(kpi.clicks),sub:'product interactions',cl:'#8b5cf6'},
          {lbl:'Avg. CTR',val:pct(kpi.avgCTR),sub:'click-through rate',cl:'#3b82f6'},
          {lbl:'Avg. CTOR',val:pct(kpi.avgCTOR),sub:'click-to-order rate',cl:'#10b981'},
        ].map(x=>(
          <Card key={x.lbl}>
            <p className="text-gray-600 text-xs uppercase tracking-wide mb-1">{x.lbl}</p>
            <p className="text-2xl font-bold" style={{color:x.cl}}>{x.val}</p>
            <p className="text-gray-600 text-xs mt-0.5">{x.sub}</p>
          </Card>
        ))}
      </div>

      {/* ── STRATEGY + BUNDLING ── */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

        {/* Strategic Insights */}
        <Card>
          <SecHead icon={IC.Bulb} title="Strategic Insights" sub="Data-driven operational recommendations"/>
          <div className="space-y-3">

            {/* Sprint vs Marathon */}
            <div className="rounded-xl p-3.5 border border-gray-700/50 bg-gray-800/30">
              <div className="flex items-center gap-2 mb-2">
                <IC.Zap/>
                <span className="text-white text-xs font-bold uppercase tracking-wide">Sprint vs Marathon Efficiency</span>
              </div>
              <div className="grid grid-cols-2 gap-3 mb-2">
                <div className="text-center rounded-lg p-2.5 border border-orange-500/20" style={{background:'rgba(249,115,22,0.08)'}}>
                  <p className="text-orange-400 font-bold text-xs mb-1">2h Sprint</p>
                  <p className="text-white font-bold">{fmt(insights.b2.gmvPH)}<span className="text-gray-500 text-xs">/hr</span></p>
                  <p className="text-gray-600 text-xs mt-0.5">{insights.b2.slot}</p>
                </div>
                <div className="text-center rounded-lg p-2.5 border border-purple-500/20" style={{background:'rgba(139,92,246,0.08)'}}>
                  <p className="text-purple-400 font-bold text-xs mb-1">4h Marathon</p>
                  <p className="text-white font-bold">{fmt(insights.b4.gmvPH)}<span className="text-gray-500 text-xs">/hr</span></p>
                  <p className="text-gray-600 text-xs mt-0.5">{insights.b4.slot}</p>
                </div>
              </div>
              <p className="text-gray-400 text-xs">
                {insights.b4.gmvPH>insights.b2.gmvPH
                  ?`✅ 4h marathons outperform sprints by ${pct((insights.b4.gmvPH-insights.b2.gmvPH)/insights.b2.gmvPH*100)} GMV/hr. Extend prime-time sessions to 4h blocks.`
                  :`✅ 2h sprints yield +${pct((insights.b2.gmvPH-insights.b4.gmvPH)/insights.b4.gmvPH*100)} GMV/hr vs marathons. Prioritize high-energy quick streams.`}
              </p>
            </div>

            {/* Top host-slot pairs */}
            <div className="rounded-xl p-3.5 border border-gray-700/50 bg-gray-800/30">
              <div className="flex items-center gap-2 mb-2.5">
                <IC.Star/>
                <span className="text-white text-xs font-bold uppercase tracking-wide">Top Host × Time-Slot Pairings</span>
              </div>
              {insights.topPairs.map((p,i)=>(
                <div key={i} className="flex items-center justify-between text-sm mb-2">
                  <span className="text-gray-400">
                    <span style={{color:HOST_CLR[p.host]||'#f97316'}} className="font-bold">{p.host}</span>
                    <span className="text-gray-600"> excels in </span>
                    <span className="text-purple-400">{p.slot}</span>
                  </span>
                  <span className="text-emerald-400 font-semibold text-xs">{fmt(p.gmv)}</span>
                </div>
              ))}
            </div>

            {/* Under-performers */}
            {insights.underHosts.length>0&&(
              <div className="rounded-xl p-3.5 border border-amber-700/30" style={{background:'rgba(120,53,15,0.1)'}}>
                <p className="text-amber-400 text-xs font-bold uppercase tracking-wide mb-2">⚠️ Bundle Attention — High ATC / Low CTOR</p>
                {insights.underHosts.map(h=>(
                  <div key={h.host} className="flex justify-between text-xs text-gray-400 mb-1.5">
                    <span style={{color:HOST_CLR[h.host]}} className="font-semibold">{h.host}</span>
                    <span>{fmtN(h.atc)} ATC · <span className="text-rose-400">{pct(h.ctor)} CTOR</span></span>
                    <span className="text-gray-600">→ Recommend bundling</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </Card>

        {/* Smart Bundling Matrix */}
        <Card>
          <SecHead icon={IC.Package} title="Smart Bundling Matrix" sub="High ATC / Low CTOR — pairing recommendations"/>
          <div className="space-y-3">
            {[
              {
                emoji:'🔥',
                title:'Flagship Lip Bundle',
                a:{lbl:'Lipscreen SPF50',cl:'#f97316'},
                b:{lbl:'Hydra Lipbalm',cl:'#ec4899'},
                note:'Lipscreen drives massive impressions & ATC but lone CTOR is weak. Bundling with Lipbalm creates an "AM Skin Shield" value set — estimated +25–35% conversion uplift.',
                border:'#f97316',
                bg:'rgba(249,115,22,0.06)',
              },
              {
                emoji:'💡',
                title:'AM Glow Skincare Set',
                a:{lbl:'Sunscreen SPF60',cl:'#3b82f6'},
                b:{lbl:'Vitamin C Serum',cl:'#a78bfa'},
                note:'Sunscreen as anchor product with high recall but cart abandonment. Serum acts as AOV driver — "complete your morning routine" narrative boosts CTOR by est. +20%.',
                border:'#8b5cf6',
                bg:'rgba(139,92,246,0.06)',
              },
              {
                emoji:'✨',
                title:'Makeup Finishing Duo',
                a:{lbl:'Blush Duo',cl:'#ec4899'},
                b:{lbl:'Setting Spray',cl:'#10b981'},
                note:'Blush Duo has top CTR but high cart drop-off. Setting spray completes the look narrative, pushing CTOR from ≈5% to a projected 9–12%.',
                border:'#10b981',
                bg:'rgba(16,185,129,0.06)',
              },
              {
                emoji:'🎁',
                title:'Ramadan/Raya Gift Set',
                a:{lbl:'Sheet Mask Pack',cl:'#f59e0b'},
                b:{lbl:'Tinted Moisturizer',cl:'#f97316'},
                note:'Campaign periods show high sheet mask curiosity with low solo conversion. Positioning as a festive gift bundle drives gifting intent purchases — high in Mar–Apr.',
                border:'#f59e0b',
                bg:'rgba(245,158,11,0.06)',
              },
            ].map((bun,i)=>(
              <div key={i} className="rounded-xl p-3.5" style={{background:bun.bg,border:`1px solid ${bun.border}30`}}>
                <div className="flex items-center gap-2 mb-2">
                  <span>{bun.emoji}</span>
                  <span className="text-white font-semibold text-sm">{bun.title}</span>
                </div>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className="px-2 py-0.5 rounded-md text-xs font-medium" style={{background:bun.a.cl+'25',color:bun.a.cl}}>{bun.a.lbl}</span>
                  <span className="text-gray-600 text-xs font-bold">+</span>
                  <span className="px-2 py-0.5 rounded-md text-xs font-medium" style={{background:bun.b.cl+'25',color:bun.b.cl}}>{bun.b.lbl}</span>
                </div>
                <p className="text-gray-500 text-xs leading-relaxed">{bun.note}</p>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* ── HOST GMV BAR CHART ── */}
      <Card className="mb-6">
        <SecHead icon={IC.Bar2} title="Host GMV Comparison" sub="Total revenue contribution per host in selected period"/>
        <ResponsiveContainer width="100%" height={200}>
          <BarChart data={sortedHosts.sort((a,b)=>b.gmv-a.gmv)} margin={{top:4,right:16,bottom:0,left:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1f2937"/>
            <XAxis dataKey="host" stroke="#374151" tick={{fill:'#9ca3af',fontSize:12}}/>
            <YAxis stroke="#374151" tick={{fill:'#6b7280',fontSize:10}} tickFormatter={v=>`RM${(v/1000).toFixed(0)}K`}/>
            <TT formatter={(v,n)=>[fmt(v),'GMV']}/>
            <Bar dataKey="gmv" name="GMV" radius={[6,6,0,0]}>
              {sortedHosts.sort((a,b)=>b.gmv-a.gmv).map((h,i)=><Cell key={i} fill={HOST_CLR[h.host]||'#f97316'}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>

      {/* ── FOOTER ── */}
      <div className="text-center text-gray-800 text-xs py-4">
        Shopee Live Analytics Dashboard · Jan–May 2026 · {SESSIONS.length} sessions · Built with React + Recharts
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
